name: Continuous Integration & Deployment Loop
on:
  push:
    branches: [ main ]
jobs:
  build-and-ship:
    runs-on: self-hosted
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Synchronize Local Cluster Container Registry Space
      shell: powershell
      run: |
        $ErrorActionPreference = "Stop"

        # 1. Target explicit relative folders
        $BACKEND_DIR = Join-Path $PWD "backend"
        $FRONTEND_DIR = Join-Path $PWD "frontend"

        Write-Output "Target Backend Path: $BACKEND_DIR"
        Write-Output "Target Frontend Path: $FRONTEND_DIR"

        # 2. Bind active shell runner context to Minikube's Docker engine space
        & minikube -p minikube docker-env | Invoke-Expression

        # 3. Compile clean images by targeting the authenticated paths directly
        docker build -t localhost:5001/appstars-backend:${{ github.sha }} -f "$BACKEND_DIR\Dockerfile.backend" "$BACKEND_DIR"
        if ($LASTEXITCODE -ne 0) { Write-Error "Backend image build FAILED"; exit 1 }

        docker build -t localhost:5001/appstars-frontend:${{ github.sha }} -f "$FRONTEND_DIR\Dockerfile.frontend" "$FRONTEND_DIR"
        if ($LASTEXITCODE -ne 0) { Write-Error "Frontend image build FAILED"; exit 1 }

        # 4. Confirm images actually exist in minikube's docker daemon before continuing
        Write-Output "Images present in minikube's docker daemon:"
        docker images | Select-String "appstars-backend|appstars-frontend"

    - name: Perform Package Optimization and GitOps Deployment
      shell: powershell
      run: |
        $ErrorActionPreference = "Stop"

        # 4. Target the exact chart location layout
        $CHART_PATH = Join-Path $PWD "helm\web3-app"
        Write-Output "Verified Clean Helm Chart location at: $CHART_PATH"

        # 5. Execute validations and deploy everything locally without relying on the internet
        helm lint "$CHART_PATH"
        if ($LASTEXITCODE -ne 0) { Write-Error "Helm lint FAILED"; exit 1 }

        helm upgrade --install appstars-release "$CHART_PATH" --set imageTag=${{ github.sha }}
        if ($LASTEXITCODE -ne 0) { Write-Error "Helm upgrade FAILED"; exit 1 }

    - name: Verify Cluster State Rollout Stability
      shell: powershell
      run: |
        $ErrorActionPreference = "Stop"

        # 6. Ensure deployment services reach a verified healthy running phase
        kubectl rollout status deployment/web3-app-frontend --timeout=90s
        if ($LASTEXITCODE -ne 0) { Write-Error "Frontend rollout FAILED"; exit 1 }

        kubectl rollout status deployment/web3-app-backend --timeout=90s
        if ($LASTEXITCODE -ne 0) { Write-Error "Backend rollout FAILED"; exit 1 }
