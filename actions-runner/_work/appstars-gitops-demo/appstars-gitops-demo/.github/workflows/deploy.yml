name: Continuous Integration & Deployment Loop

on:
  push:
    branches: [ main ]

jobs:
  build-and-ship:
    runs-on: self-hosted
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Synchronize Local Cluster Container Registry Space
      shell: powershell
      run: |
        # 1. Dynamically locate where backend and frontend subfolders live
        $BACKEND_DIR = (Get-ChildItem -Path . -Filter "Dockerfile.backend" -Recurse | Select-Object -First 1).Directory.FullName
        $FRONTEND_DIR = (Get-ChildItem -Path . -Filter "Dockerfile.frontend" -Recurse | Select-Object -First 1).Directory.FullName
        
        Write-Output "Discovered Backend Context at: $BACKEND_DIR"
        Write-Output "Discovered Frontend Context at: $FRONTEND_DIR"

        # 2. Link the active shell context runner to the Minikube Docker daemon space
        & minikube -p minikube docker-env | Invoke-Expression
        
        # 3. Compile images cleanly by explicitly targeting the discovered paths
        docker build -t localhost:5001/appstars-backend:${{ github.sha }} -f "$BACKEND_DIR\Dockerfile.backend" "$BACKEND_DIR"
        docker build -t localhost:5001/appstars-frontend:${{ github.sha }} -f "$FRONTEND_DIR\Dockerfile.frontend" "$FRONTEND_DIR"

    - name: Perform Package Optimization and GitOps Deployment
      shell: powershell
      run: |
        # 4. Dynamically locate your Chart folder path, avoiding folder nesting issues
        $CHART_PATH = (Get-ChildItem -Path . -Filter "Chart.yaml" -Recurse | Select-Object -First 1).Directory.FullName
        Write-Output "Discovered Helm Chart location at: $CHART_PATH"
        
        # 5. Execute linting syntax checks and push rolling upgrade rollouts
        helm lint "$CHART_PATH"
        helm upgrade --install appstars-release "$CHART_PATH" --set imageTag=${{ github.sha }} --force

    - name: Verify Cluster State Rollout Stability
      shell: powershell
      run: |
        # 6. Ensure deployment services reach a verified healthy running phase
        kubectl rollout status deployment/web3-app-frontend --timeout=90s
        kubectl rollout status deployment/web3-app-backend --timeout=90s
